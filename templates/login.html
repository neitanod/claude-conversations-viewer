<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Claude Conversations Viewer</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        if (localStorage.getItem('theme') === 'dark' ||
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.style.background = '#0f172a';
        }
    </script>
    <script src="/static/i18n.js"></script>
</head>
<body>
    <header>
        <h1>Claude Conversations Viewer</h1>
    </header>

    <main>
        <div class="login-container">
            <h2 data-i18n="Log in">Log in</h2>
            {{if .Error}}
            <div class="login-error" data-i18n="Invalid username or password">Invalid username or password</div>
            {{end}}
            <form method="POST" action="/login" class="login-form">
                <div class="form-group">
                    <label for="username" data-i18n="Username">Username</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password" data-i18n="Password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="login-btn" data-i18n="Enter">Enter</button>
            </form>
        </div>
    </main>

    <footer>
        <p>Claude Conversations Viewer</p>
    </footer>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark');
            }
        })();
    </script>
</body>
</html>
